apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: final-devops-project
  namespace: default 
spec:
  project: default
  source:
    repoURL: https://github.com/lbalbi00/final-devops-project.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 